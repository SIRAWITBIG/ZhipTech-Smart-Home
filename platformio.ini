[platformio]
default_envs = esp32dev
data_dir = data

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINOJSON_USE_DOUBLE=0

; Compile-only validation of enabled drivers. Never upload this environment
; until the exact board, wiring and module voltage/polarity have been reviewed.
[env:esp32dev-hardware-compile]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D HUB_HARDWARE_ENABLED=1

